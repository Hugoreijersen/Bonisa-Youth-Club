<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Jongerenzang 2027 post</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0}
a{color:#3A7230}a:hover{color:#2A5523}
</style>
</helmet>
<div style="width: 1080px; height: 1350px; box-sizing: border-box; background: {{groenTint}}; color: #1C1F1A; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="position: relative; height: 600px">
<img src="assets/hero-2025.jpg" alt="Jongeren zingen samen in de Nieuwe Kerk in Katwijk" style="display: block; width: 100%; height: 600px; object-fit: cover">
<span style="position: absolute; left: 64px; bottom: -28px; padding: 14px 26px; border-radius: 999px; background: {{oranje}}; color: #1C1F1A; font-size: 26px; font-weight: 700">D.V. vrijdag 21 mei 2027</span>
</div>
<div style="flex-grow: 1; padding: 72px 64px 56px; display: flex; flex-direction: column; gap: 22px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 116px; line-height: 0.95; letter-spacing: -0.02em">Gods Koninkrijk komt!</h1>
<p style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 500; font-size: 44px; line-height: 1.3">Met <span style="background: #FFFFFF; padding: 0 10px; border-radius: 10px">recht</span>, <span style="background: {{groenTint2}}; padding: 0 10px; border-radius: 10px">vrede</span> en <span style="background: {{oranjeTint2}}; padding: 0 10px; border-radius: 10px">blijdschap</span></p>
<div style="flex-grow: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: center; gap: 24px; border-top: 3px solid {{groenDonker}}; padding-top: 22px">
<div style="display: flex; flex-direction: column; line-height: 1.1">
<span style="font-size: 20px; letter-spacing: 0.06em">Katwijkse</span>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.04em; color: {{groenDonker}}">JONGERENZANG</span>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; font-size: 24px; line-height: 1.3">
<strong>19:45 · Nieuwe Kerk Katwijk</strong>
<span style="color: #3D4639">Bestel je ticket op jongerenzang.nl</span>
<span style="color: #3D4639">Collecte voor Stichting Bonisa</span>
</div>
<img src="assets/byc-logo.png" alt="Logo Bonisa Youthclub" style="display: block; height: 84px; width: auto; background: #FFFFFF; border-radius: 16px; padding: 10px 14px">
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"groen":{"editor":"color","default":"#4C8C40","section":"BYC-kleuren"},"oranje":{"editor":"color","default":"#F28C1E","section":"BYC-kleuren"},"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
mix(hex, w, to) {
var h = /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : '#888888';
var n = parseInt(h.slice(1), 16);
var c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(function (v) { return Math.round(v + (to - v) * w); });
return 'rgb(' + c.join(',') + ')';
}
renderVals() {
var groen = this.props.groen ?? '#4C8C40';
var oranje = this.props.oranje ?? '#F28C1E';
return {
groen: groen,
oranje: oranje,
groenDonker: this.mix(groen, 0.24, 0),
groenTint: this.mix(groen, 0.80, 255),
groenTint2: this.mix(groen, 0.62, 255),
oranjeTint2: this.mix(oranje, 0.62, 255)
};
}
}
</script>
</body>
</html>
